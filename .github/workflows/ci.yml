name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck & Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/hiretrack_ci
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_12345
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_67890
          CRON_SECRET: test_cron_secret_12345
        run: npm test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build
